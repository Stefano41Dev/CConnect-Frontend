<aside class="sidebar">
      <div class="sidebar-content">
        <nav class="sidebar-nav">
          @for (item of sidebarItems; track item.label) {
            <button
              class="sidebar-item"
              [class.active]="activeMenu() === item.label.toLowerCase()"
              (click)="setActiveMenu(item.label.toLowerCase())"
            >
              <span class="sidebar-item-icon">
                @switch (item.icon) {
                  @case ('home') {
                    <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
                      <path
                        d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8h5z"
                      />
                    </svg>
                  }
                  @case ('compass') {
                    <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
                      <path
                        d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm3.5 9.5l-6 3.67v-7.34l6 3.67z"
                      />
                    </svg>
                  }
                  @case ('bell') {
                    <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
                      <path
                        d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V2h-3v2.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"
                      />
                    </svg>
                  }
                  @case ('mail') {
                    <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
                      <path
                        d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"
                      />
                    </svg>
                  }
                  @case ('bookmark') {
                    <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
                      <path
                        d="M17 3H5c-1.11 0-1.99.9-1.99 2L3 21l9-4 9 4V5c0-1.1-.89-2-2-2z"
                      />
                    </svg>
                  }
                  @case ('user') {
                    <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
                      <path
                        d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
                      />
                    </svg>
                  }
                  @case ('settings') {
                    <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
                      <path
                        d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.62l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94L14.4 2.81c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41L9.25 5.35C8.66 5.59 8.12 5.92 7.63 6.29L5.24 5.33c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.48.1.62l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.62l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.48-.1-.62l-2.03-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"
                      />
                    </svg>
                  }
                }
              </span>
              <span class="sidebar-item-label">{{ item.label }}</span>
            </button>
          }
        </nav>

        <!-- Botón Nueva Publicación -->
        <button class="new-post-btn">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
          </svg>
          <span>Nueva publicación</span>
        </button>
      </div>
    </aside>
