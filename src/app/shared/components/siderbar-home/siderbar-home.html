<aside class="sidebar">
      <div class="sidebar-content">
        <nav class="sidebar-nav">
          @for (item of sidebarItems; track item.label) {
            <a
              class="sidebar-item"
              [class.active]="activeMenu() === item.label.toLowerCase()"
              [routerLink] = "item.router"
              (click)="setActiveMenu(item.label.toLowerCase())"
              routerLinkActive="active"
            >
              <span class="sidebar-item-icon">
                @switch (item.icon) {
                  @case ('home') {
                    <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
                      <path
                        d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8h5z"
                      />
                    </svg>
                  } 
                  @case ('user') {
                    <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
                      <path
                        d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
                      />
                    </svg>
                  }
                }
              </span>
              <span class="sidebar-item-label">{{ item.label }}</span>
            </a>
          }
        </nav>

        <!-- Botón Nueva Publicación -->
        <button class="new-post-btn" (click)="newPost()">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
          </svg>
          <span>Nueva publicación</span>
        </button>
      </div>
</aside>

<!-- Modal Component -->
<app-post-modal></app-post-modal>
